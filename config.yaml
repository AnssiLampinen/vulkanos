data_dir: data
radius_km: 10
map_km: 10  # the map shows this square around the site
h3_res: 8

imagery:
  provider: esri
  zoom: 18  # about 0.6 m/px
  chip_tiles: 2  # detector input is 2x2 tiles = 512 px
  workers: 8

detector:
  name: yolo  # yolo, geobase_unet or unet
  conf: 0.25
  threshold: 0.5
  # checkpoint: models/r34/best.pt

training:
  dataset_dir: data/train
  models_dir: models
  val_fraction: 0.2
  ignore_edge_px: 2
  encoder: resnet34
  crop: 512
  batch_size: 8
  epochs: 30
  lr: 0.0003
  workers: 4
  seed: 0

compare:
  osm_buffer_m: 2  # osm and imagery are often a bit misaligned
  min_object_m2: 15
  low_signal_m2: 200  # cells with less detected area are greyed out
  block_px: 8
  house_min_sep_m: 4  # touching detections get split into houses at least this far apart
  min_blob_prob: 0.8  # green blobs with a lower mean probability are dropped, 0 turns it off
  ragged_holes: 5  # green blobs with this many holes and jagged edges are dropped (scrub, bare ground), 0 turns it off

volcanoes_file: volcanoes.yaml  # summit coordinates, edit there

# grids around the volcano summits, coordinates come from volcanoes_file
volcanoes:
  - {id: vesuvius}
  - {id: merapi}
  - {id: nyiragongo}
  - {id: fuego}
  - {id: taal}

# small towns for testing, volcano is the id in volcanoes_file
test_sites:
  - {id: ercolano, name: Ercolano, lat: 40.806, lon: 14.349, volcano: vesuvius}
  - {id: goma, name: Goma, lat: -1.670, lon: 29.230, volcano: nyiragongo}
