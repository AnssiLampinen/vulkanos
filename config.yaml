data_dir: data
radius_km: 10
h3_res: 8

imagery:
  provider: esri
  zoom: 18  # about 0.6 m/px
  chip_tiles: 2  # detector input is 2x2 tiles = 512 px
  workers: 8

detector:
  name: yolo  # yolo, geobase_unet or unet
  conf: 0.25
  threshold: 0.5
  # checkpoint: models/r34/best.pt

training:
  dataset_dir: data/train
  models_dir: models
  val_fraction: 0.2
  ignore_edge_px: 2
  encoder: resnet34
  crop: 512
  batch_size: 8
  epochs: 30
  lr: 0.0003
  workers: 4
  seed: 0

compare:
  osm_buffer_m: 2  # osm and imagery are often a bit misaligned
  min_object_m2: 15
  low_signal_m2: 200  # cells with less detected area are greyed out
  block_px: 8
  house_min_sep_m: 4  # touching detections get split into houses at least this far apart
  min_blob_prob: 0.8  # green blobs with a lower mean probability are dropped, 0 turns it off

volcanoes:
  - {id: vesuvius, name: Vesuvius, lat: 40.821, lon: 14.426}
  - {id: merapi, name: Merapi, lat: -7.540, lon: 110.446}
  - {id: nyiragongo, name: Nyiragongo, lat: -1.520, lon: 29.250}
  - {id: fuego, name: Fuego, lat: 14.473, lon: -90.880}
  - {id: taal, name: Taal, lat: 14.002, lon: 120.993}

# small towns for testing
test_sites:
  - {id: ercolano, name: Ercolano, lat: 40.806, lon: 14.349}
  - {id: goma, name: Goma, lat: -1.670, lon: 29.230}
