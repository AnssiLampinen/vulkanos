# Summit coordinates of each volcano, used for distance to the volcano.
#
# The coordinate used is the first one that is set:
#   1. lat/lon at the top of an entry: set these by hand to override everything else
#   2. osm: the summit node in OpenStreetMap (natural=volcano, else the highest natural=peak near the
#      gvp point), filled in by `python src/main.py volcanoes`
#   3. gvp: Smithsonian Global Volcanism Program, https://volcano.si.edu/volcano.cfm?vn=<number>
#
# GVP gives coordinates to 0.001 deg (about 100 m), OSM summit nodes are usually placed within a few
# metres, so OSM wins over GVP when it is there. `volcanoes` only rewrites the osm: lines.
#
# Test sites point at their volcano with `volcano:` in config.yaml.

vesuvius:
  name: Vesuvius
  lat:
  lon:
