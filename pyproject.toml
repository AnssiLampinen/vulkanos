[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vulkanos"
version = "0.1.0"
description = "Estimate OpenStreetMap building completeness around volcanoes from satellite imagery"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
vulkanos = ["*.html"]
